<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quo for Pipedrive</title>
<script src="https://cdn.jsdelivr.net/npm/@pipedrive/app-extensions-sdk@0/dist/index.umd.js"></script>
<style>
  :root {
    --bg: #ffffff; --ink: #1f2023; --muted: #6b6c74; --line: #e6e6ee;
    --brand: #6449fc; --brand-ink: #ffffff; --soft: #f5f4fb;
    --green: #0c8a4d; --red: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg); display: flex; flex-direction: column;
  }
  header {
    padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--brand);
    color: var(--brand-ink); display: grid; place-items: center; font-weight: 700; font-size: 15px;
  }
  .who { min-width: 0; }
  .who .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .num { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 4px; }
  input[type=text], input[type=tel], select, textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font: inherit; color: var(--ink); background: #fff; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); }
  textarea { resize: vertical; min-height: 54px; }
  button {
    border: 0; border-radius: 8px; padding: 9px 12px; font: inherit; font-weight: 600;
    cursor: pointer; background: var(--soft); color: var(--ink); white-space: nowrap;
  }
  button.primary { background: var(--brand); color: var(--brand-ink); }
  button.ghost { background: transparent; border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  a.callbtn {
    flex: 1; text-align: center; text-decoration: none; background: var(--green); color: #fff;
    border-radius: 8px; padding: 10px 12px; font-weight: 700;
  }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #history { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
  .item { display: flex; gap: 8px; align-items: baseline; font-size: 12px; }
  .item .when { color: var(--muted); flex-shrink: 0; width: 84px; }
  .item .body { min-width: 0; overflow-wrap: anywhere; }
  .item .tag { font-weight: 700; }
  .in .tag { color: var(--brand); }
  .out .tag { color: var(--green); }
  .missed .tag { color: var(--red); }
  .hint { color: var(--muted); font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  #toast.show { opacity: 1; }
  details.debug { font-size: 11px; color: var(--muted); }
  details.debug pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); padding: 8px; border-radius: 8px; max-height: 120px; overflow: auto; }
  .checkline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="logo">Q</div>
    <div class="who">
      <div class="name" id="contactName">Quo</div>
      <div class="num" id="contactNum">No number selected</div>
    </div>
  </header>

  <main>
    <div>
      <label for="toNumber">Contact number</label>
      <div class="row">
        <input type="tel" id="toNumber" placeholder="+1 (555) 123-4567" />
        <button class="ghost" id="copyBtn" title="Copy number">Copy</button>
      </div>
    </div>

    <div>
      <label for="fromNumber">Your Quo number</label>
      <select id="fromNumber"><option value="">Loading numbers…</option></select>
    </div>

    <div class="row">
      <a class="callbtn" id="callLink" href="#" title="Opens the Quo app to place the call">📞 Call with Quo</a>
      <button id="refreshBtn" class="ghost" title="Refresh history">↻</button>
    </div>

    <div class="card">
      <h3>Recent activity</h3>
      <div id="history"><div class="hint">Enter a contact number to load history.</div></div>
    </div>

    <div class="card">
      <h3>Send a text</h3>
      <textarea id="msgBody" placeholder="Type your message…"></textarea>
      <div class="row" style="margin-top:8px; justify-content: space-between;">
        <span class="checkline"><input type="checkbox" id="autoLog" checked /> Log to Pipedrive</span>
        <button class="primary" id="sendBtn">Send text</button>
      </div>
    </div>

    <div class="card">
      <h3>Log a call</h3>
      <input type="text" id="logSubject" placeholder="Subject (e.g. Called re: wedding arch quote)" />
      <textarea id="logNote" placeholder="Outcome / notes…" style="margin-top:8px;"></textarea>
      <div class="row" style="margin-top:8px; justify-content: flex-end;">
        <button id="logBtn">Save to timeline</button>
      </div>
    </div>

    <details class="debug">
      <summary>Debug: context from Pipedrive</summary>
      <pre id="debugCtx">(none received yet)</pre>
    </details>
  </main>

  <div id="toast"></div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const pdToken = qs.get('token') || '';
  let sdk = null;
  let personId = null, dealId = null, orgId = null;

  const $ = (id) => document.getElementById(id);
  const toastEl = $('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  function toE164(raw) {
    if (!raw) return null;
    const cleaned = String(raw).replace(/[^\d+]/g, '');
    if (cleaned.startsWith('+')) return cleaned;
    const d = cleaned.replace(/\D/g, '');
    if (d.length === 10) return '+1' + d;
    if (d.length === 11 && d[0] === '1') return '+' + d;
    return d ? '+' + d : null;
  }

  function prettyPhone(e164) {
    const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(e164 || '');
    return m ? `(${m[1]}) ${m[2]}-${m[3]}` : (e164 || '');
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { 'x-pipedrive-token': pdToken, 'Content-Type': 'application/json', ...(opts.headers || {}) },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('Request failed (' + res.status + ')'));
    return body;
  }

  // ---- Context extraction ---------------------------------------------------
  // Pipedrive passes context when the window opens from a phone-number click.
  // Field names vary, so scan recursively for phone-like values and record IDs.
  const PHONE_KEY = /phone|number|tel/i;
  const looksLikePhone = (v) => typeof v === 'string' && /^[+\d][\d\s().-]{6,}$/.test(v.trim());

  function scanContext(obj, depth = 0) {
    if (!obj || typeof obj !== 'object' || depth > 5) return;
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === 'object') { scanContext(v, depth + 1); continue; }
      if (/^person_?id$/i.test(k) && v) personId = v;
      else if (/^deal_?id$/i.test(k) && v) dealId = v;
      else if (/^org(anization)?_?id$/i.test(k) && v) orgId = v;
      else if (/^(person_?)?name$/i.test(k) && typeof v === 'string' && v.trim()) $('contactName').textContent = v.trim();
      else if (PHONE_KEY.test(k) && looksLikePhone(String(v))) setContactNumber(String(v));
      else if (looksLikePhone(String(v)) && !$('toNumber').value) setContactNumber(String(v));
    }
  }

  function setContactNumber(raw) {
    const e164 = toE164(raw);
    if (!e164) return;
    $('toNumber').value = e164;
    $('contactNum').textContent = prettyPhone(e164);
    $('callLink').href = 'tel:' + e164;
    loadHistory();
  }

  // ---- Quo numbers ----------------------------------------------------------
  async function loadNumbers() {
    try {
      const { numbers } = await api('/api/numbers');
      const sel = $('fromNumber');
      sel.innerHTML = '';
      if (!numbers.length) {
        sel.innerHTML = '<option value="">No Quo numbers found</option>';
        return;
      }
      for (const n of numbers) {
        const opt = document.createElement('option');
        opt.value = n.number;
        opt.dataset.id = n.id;
        opt.textContent = (n.name ? n.name + ' — ' : '') + prettyPhone(n.number);
        sel.appendChild(opt);
      }
      loadHistory();
    } catch (e) {
      $('fromNumber').innerHTML = '<option value="">Error loading numbers</option>';
      toast(e.message);
    }
  }

  // ---- History --------------------------------------------------------------
  function fmtWhen(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: sameYear ? undefined : '2-digit' }) +
      ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  async function loadHistory() {
    const phone = toE164($('toNumber').value);
    const sel = $('fromNumber');
    const opt = sel.options[sel.selectedIndex];
    const phoneNumberId = opt && opt.dataset ? opt.dataset.id : null;
    const box = $('history');
    if (!phone || !phoneNumberId) return;
    box.innerHTML = '<div class="hint">Loading…</div>';
    try {
      const { items, warnings } = await api('/api/history?phone=' + encodeURIComponent(phone) + '&phoneNumberId=' + encodeURIComponent(phoneNumberId));
      if (!items.length) {
        box.innerHTML = '<div class="hint">No calls or texts with this number yet.</div>';
      } else {
        box.innerHTML = '';
        for (const it of items) {
          const div = document.createElement('div');
          const missed = it.kind === 'call' && /missed|no-answer/i.test(it.status || '');
          div.className = 'item ' + (missed ? 'missed' : (it.direction === 'incoming' ? 'in' : 'out'));
          const tag = it.kind === 'call'
            ? (missed ? '✗ Missed call' : (it.direction === 'incoming' ? '↓ Call' : '↑ Call') + (it.duration ? ' · ' + Math.round(it.duration / 60) + 'm' : ''))
            : (it.direction === 'incoming' ? '↓ Text' : '↑ Text');
          div.innerHTML = '<span class="when">' + fmtWhen(it.createdAt) + '</span>' +
            '<span class="body"><span class="tag">' + tag + '</span>' +
            (it.text ? ' — ' + it.text.replace(/</g, '&lt;') : '') + '</span>';
          box.appendChild(div);
        }
      }
      if (warnings && warnings.length) console.warn('History warnings:', warnings);
    } catch (e) {
      box.innerHTML = '<div class="hint">Could not load history: ' + e.message + '</div>';
    }
  }

  // ---- Actions --------------------------------------------------------------
  $('sendBtn').addEventListener('click', async () => {
    const to = toE164($('toNumber').value);
    const from = $('fromNumber').value;
    const content = $('msgBody').value.trim();
    if (!to) return toast('Enter a contact number first');
    if (!from) return toast('Pick which Quo number to send from');
    if (!content) return toast('Type a message first');
    $('sendBtn').disabled = true;
    try {
      await api('/api/send-message', { method: 'POST', body: JSON.stringify({ to, from, content }) });
      $('msgBody').value = '';
      toast('Text sent ✓');
      snackbar('Text sent via Quo');
      if ($('autoLog').checked && (personId || dealId)) {
        api('/api/log-activity', {
          method: 'POST',
          body: JSON.stringify({ type: 'sms', subject: 'Texted ' + prettyPhone(to) + ' via Quo', note: content, personId, dealId, orgId }),
        }).catch((e) => console.warn('Auto-log failed:', e.message));
      }
      setTimeout(loadHistory, 1200);
    } catch (e) {
      toast(e.message);
    } finally {
      $('sendBtn').disabled = false;
    }
  });

  $('logBtn').addEventListener('click', async () => {
    const subject = $('logSubject').value.trim() || ('Called ' + prettyPhone(toE164($('toNumber').value)) + ' via Quo');
    $('logBtn').disabled = true;
    try {
      await api('/api/log-activity', {
        method: 'POST',
        body: JSON.stringify({ type: 'call', subject, note: $('logNote').value.trim(), personId, dealId, orgId }),
      });
      $('logSubject').value = '';
      $('logNote').value = '';
      toast('Logged to Pipedrive ✓');
      snackbar('Call logged to the timeline');
    } catch (e) {
      toast(e.message);
    } finally {
      $('logBtn').disabled = false;
    }
  });

  $('copyBtn').addEventListener('click', async () => {
    const v = toE164($('toNumber').value);
    if (!v) return;
    try { await navigator.clipboard.writeText(v); toast('Copied ' + v); } catch (_) { toast(v); }
  });

  $('refreshBtn').addEventListener('click', loadHistory);
  $('fromNumber').addEventListener('change', loadHistory);
  $('toNumber').addEventListener('change', () => setContactNumber($('toNumber').value));
  $('callLink').addEventListener('click', (e) => {
    if (!toE164($('toNumber').value)) { e.preventDefault(); toast('Enter a contact number first'); }
    else { $('callLink').href = 'tel:' + toE164($('toNumber').value); }
  });

  async function snackbar(message) {
    try {
      if (sdk && window.__Command) await sdk.execute(window.__Command.SHOW_SNACKBAR, { message });
    } catch (_) { /* non-fatal */ }
  }

  // ---- SDK init -------------------------------------------------------------
  async function init() {
    try {
      const ns = window.AppExtensionsSDK || {};
      const SDKClass = ns.default || ns;
      const Event = ns.Event || { VISIBILITY: 'visibility' };
      window.__Command = ns.Command || { SHOW_SNACKBAR: 'show_snackbar', RESIZE: 'resize' };
      sdk = await new SDKClass().initialize({ size: { width: 400, height: 620 } });
      sdk.listen(Event.VISIBILITY, ({ data }) => {
        if (data && data.context) {
          $('debugCtx').textContent = JSON.stringify(data.context, null, 2);
          scanContext(data.context);
        }
      });
    } catch (e) {
      // Outside Pipedrive (local testing) the handshake fails — keep UI usable.
      console.warn('SDK init failed (running outside Pipedrive?):', e);
    }
    loadNumbers();
  }
  init();
})();
</script>
</body>
</html>
